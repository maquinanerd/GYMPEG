<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Principal" style="flex:none;position:relative;background:#FFFFFF;border-top:1px solid #E9E9E9;padding:6px 8px 30px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <a href="#" aria-current="{{ it.current }}" style="height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:{{ it.color }}">
      <span style="width:52px;height:28px;border-radius:8px;background:{{ it.bg }};display:flex;align-items:center;justify-content:center;font-size:20px"><i class="{{ it.icon }}"></i></span>
      <span style="font-size:12px;font-weight:{{ it.w }}">{{ it.label }}</span>
    </a>
  </sc-for>
  <span style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111111"></span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:89},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;treinos&quot;,&quot;evolucao&quot;,&quot;coach&quot;,&quot;perfil&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'inicio';
    const items = [['inicio','Início','ph-house'],['treinos','Treinos','ph-barbell'],['evolucao','Evolução','ph-chart-line-up'],['coach','Coach','ph-chat-circle-text'],['perfil','Perfil','ph-user-circle']]
      .map(([k, label, ic]) => { const on = k === a; return { label, current: on ? 'page' : undefined, icon: (on ? 'ph-fill ' : 'ph ') + ic, bg: on ? '#CCFF00' : 'transparent', color: on ? '#111111' : '#646464', w: on ? 600 : 500 }; });
    return { items };
  }
}
</script>
</body>
</html>
