<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script><style>html,body{margin:0;background:#F9F9F9}button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}:focus-visible{outline:2px solid #111111;outline-offset:2px}@media (prefers-reduced-motion: reduce){*{transition:none !important}}</style></helmet>
<div style="width:100%;max-width:430px;margin:0 auto;height:844px;position:relative;background:#F9F9F9;font-family:Archivo, sans-serif;color:#111111;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:{{ fill }};background:#CCFF00;transition:height 1s linear"></div>
  <div style="position:relative;height:100%;display:flex;flex-direction:column">
    <dc-import name="StatusBar" hint-size="100%,54px"></dc-import>
    <header style="padding:0 8px;display:flex;align-items:center;gap:4px">
      <button aria-label="Voltar ao treino" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px"><i class="ph-bold ph-caret-down"></i></button>
      <div style="display:flex;flex-direction:column"><span style="font-size:17px;font-weight:600">Descanso</span><span style="font-size:13px;font-weight:500;color:#646464">Supino reto · série 2 registrada, 82,5 × 7</span></div>
    </header>
    <div role="timer" aria-live="off" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <span style="font-family:Archivo, sans-serif;font-stretch:110%;font-weight:600;font-variant-numeric:tabular-nums;font-size:96px;line-height:1;letter-spacing:-0.03em">{{ time }}</span>
      <span style="font-size:16px;font-weight:600;color:#646464">{{ sub }}</span>
    </div>
    <div style="padding:0 20px 34px;display:flex;flex-direction:column;gap:10px">
      <div style="background:#FFFFFF;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
        <span style="font-size:13px;font-weight:600;color:#646464">Próxima: série 3 de 3</span>
        <span style="font-family:Archivo, sans-serif;font-stretch:118%;font-weight:600;font-variant-numeric:tabular-nums;font-size:22px">82,5 kg × 7 · RIR 2</span>
        <span style="font-size:14px;font-weight:500;color:#646464;line-height:1.4">Mesma carga: a série 2 ficou dentro da faixa de 6‑8.</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <button onClick="{{ minus }}" style="height:64px;border-radius:12px;background:#FFFFFF;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums">−15 s</button>
        <button onClick="{{ pause }}" style="height:64px;border-radius:12px;background:#FFFFFF;font-size:17px;font-weight:600">{{ pauseLabel }}</button>
        <button onClick="{{ plus }}" style="height:64px;border-radius:12px;background:#FFFFFF;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums">+15 s</button>
      </div>
      <button onClick="{{ skip }}" style="height:64px;border-radius:12px;background:#111111;color:#FFFFFF;font-size:17px;font-weight:600">{{ skipLabel }}</button>
    </div>
    <span style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111111"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { left: 105, total: 180, paused: false };
  componentDidMount() { this.t = setInterval(() => { if (!this.state.paused && this.state.left > 0) this.setState(s => ({ left: s.left - 1 })); }, 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const { left, total, paused } = this.state;
    const mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
    return {
      time: `${mm}:${ss}`, fill: (left / total * 100).toFixed(2) + '%',
      sub: left === 0 ? 'Hora da série 3' : paused ? 'Pausado' : 'de 03:00',
      pauseLabel: paused ? 'Continuar' : 'Pausar', skipLabel: left === 0 ? 'Ir para a série 3' : 'Pular descanso',
      minus: () => this.setState(s => ({ left: Math.max(0, s.left - 15) })),
      plus: () => this.setState(s => ({ left: s.left + 15, total: Math.max(s.total, s.left + 15) })),
      pause: () => this.setState(s => ({ paused: !s.paused })),
      skip: () => this.setState({ left: 0 })
    };
  }
}
</script>
</body>
</html>
