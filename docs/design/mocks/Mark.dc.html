<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 64 64" fill="none" style="display:block"><path d="{{ d }}" stroke="{{ color }}" stroke-width="{{ sw }}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'|'c'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#CCFF00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = {
      a: 'M10 47 H22 V37 H32 V27 H42 V17 H54',
      b: 'M8 46 H20 L30 32 H38 L48 18 H56',
      c: 'M8 49 L20 35 L26 41 L38 25 L44 31 L56 15'
    };
    return { d: P[this.props.variant] || P.a, size: this.props.size ?? 64, color: this.props.color ?? '#CCFF00', sw: this.props.weight ?? 6 };
  }
}
</script>
</body>
</html>
